<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>TOOLVERSE — Online Tools</title>
<link rel="stylesheet" href="style.css">
<style>
.toolbox{max-width:850px;margin:50px auto;padding:25px;background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.15);border-radius:20px}
.toolbox textarea,.toolbox input,.toolbox select{width:100%;padding:15px;margin:12px 0;background:#151525;color:white;border:1px solid #555;border-radius:10px;font-size:16px}
.toolbox textarea{min-height:180px}
.toolbox button{padding:12px 20px;margin:8px 5px 8px 0;border:0;border-radius:9px;background:linear-gradient(100deg,#38d9ed,#a16cf5);font-weight:bold;color:#090914}
#result{white-space:pre-wrap;overflow-wrap:anywhere;color:#65eaff;margin-top:15px}
</style>
</head>
<body>
<main class="toolbox">
<a href="/">← Back to TOOLVERSE</a>
<h1 id="heading">Online Tool</h1>
<p id="description">Use this free online tool.</p>
<div id="workspace"></div>
<div id="result"></div>
</main>
<script src="tools.js"></script>
</body>
</html>
