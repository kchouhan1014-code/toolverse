<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Login | TOOLVERSE</title>
<link rel="stylesheet" href="style.css">
<style>
.auth-wrap{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px}
.auth-card{width:100%;max-width:420px;padding:32px;border:1px solid #ffffff30;border-radius:22px;background:#ffffff0c;backdrop-filter:blur(18px)}
.auth-card h1{text-align:center;margin-bottom:8px}
.auth-card p{text-align:center;opacity:.75}
.auth-card input{width:100%;padding:14px;margin:10px 0;border:1px solid #ffffff35;border-radius:10px;background:#ffffff12;color:inherit}
.auth-card button{width:100%;padding:14px;margin-top:14px;border:0;border-radius:10px;background:#8b5cf6;color:white;font-weight:bold}
#message{text-align:center;margin-top:15px}
.auth-card a{color:#a78bfa}
</style>
</head>
<body>
<div class="auth-wrap">
<div class="auth-card">
<h1>Welcome Back</h1>
<p>Login to your TOOLVERSE account</p>
<form id="loginForm">
<input name="email" type="email" placeholder="Email address" required>
<input name="password" type="password" placeholder="Password" required>
<button type="submit">Login</button>
</form>
<div id="message"></div>
<p>New to TOOLVERSE? <a href="signup.html">Create Account</a></p>
<p><a href="/">Back to TOOLVERSE</a></p>
</div>
</div>
<script>
document.getElementById("loginForm").addEventListener("submit",async function(e){
e.preventDefault();
const message=document.getElementById("message");
const data=Object.fromEntries(new FormData(this));
message.textContent="Logging in...";
try{
const response=await fetch("/api/auth/login",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify(data)});
const result=await response.json();
if(!response.ok)throw new Error(result.error||"Login failed");
message.textContent="Login successful! Redirecting...";
window.location.href="/";
}catch(error){message.textContent=error.message;}
});
</script>
</body>
</html>
